<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma Palavra para Você</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  color: #f5f5f5;
  background:
    radial-gradient(circle at 15% 50%, rgba(255,215,150,0.12), rgba(0,0,0,0) 45%),
    radial-gradient(circle at 85% 50%, rgba(255,215,150,0.12), rgba(0,0,0,0) 45%),
    radial-gradient(ellipse at top, rgba(255,215,150,0.35), rgba(0,0,0,0) 60%),
    linear-gradient(to bottom, #0b0b0b, #1a1a1a);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(8px);
  border-radius: 22px;
  padding: 32px 24px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  text-align: center;
}

h1 {
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 26px;
}

.versiculo { font-size: 19px; line-height: 1.6; margin-bottom: 12px; }
.referencia { font-size: 14px; opacity: 0.85; margin-bottom: 20px; }
.aplicacao { font-size: 15px; font-style: italic; opacity: 0.95; margin-bottom: 28px; }
.pergunta { font-size: 15px; margin-bottom: 14px; opacity: 0.9; }

.opcoes button {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.03);
  color: #f5f5f5;
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s ease;
}
.opcoes button:hover {
  background: rgba(255,255,255,0.08);
  transform: scale(1.02);
}

.agradecimento {
  margin-top: 18px;
  font-size: 14px;
  display: none;
  opacity: 0.9;
}

.contador {
  margin-top: 30px;
  font-size: 13px;
  opacity: 0.75;
}
</style>
</head>

<body>

<div class="card">

  <h1>Uma Palavra para Você</h1>

  <div class="versiculo" id="texto">Carregando versículo...</div>
  <div class="referencia" id="ref"></div>
  <div class="aplicacao" id="aplicacao"></div>

  <div class="pergunta">
    O que essa Palavra gerou no seu coração?
  </div>

  <div class="opcoes" id="opcoes">
    <button>🙌 Fui abençoado(a)</button>
    <button>🕊️ Acalmou meu coração</button>
    <button>✨ Era exatamente o que eu precisava</button>
    <button>📖 Senti que Deus falou comigo</button>
  </div>

  <div class="agradecimento" id="msgObrigado">
    🙏 Obrigado por compartilhar.<br>
    Que Deus continue falando com você.
  </div>

  <div class="contador">
    📖 Esta Palavra já alcançou <span id="contadorNumero">...</span> pessoas
  </div>

</div>

<script>
/* CONTADOR (CounterAPI) */
fetch("https://api.counterapi.dev/v1/Printtech3d/Palavra-diaria/up")
  .then(res => res.json())
  .then(data => {
    document.getElementById("contadorNumero").innerText = data.count;
  })
  .catch(() => {
    document.getElementById("contadorNumero").innerText = "—";
  });

/* Versículo aleatório */
async function carregarVersiculo() {
  try {
    const resposta = await fetch('./almeida_ra.json');
    if (!resposta.ok) throw new Error();

    const dados = await resposta.json();
    const indice = Math.floor(Math.random() * dados.length);
    const escolhido = dados[indice];

    document.getElementById('texto').innerText = escolhido.texto;
    document.getElementById('ref').innerText = escolhido.referencia;
    document.getElementById('aplicacao').innerText = "Medite nesta palavra hoje.";

  } catch {
    document.getElementById('texto').innerText =
      "Não foi possível carregar o versículo.";
  }
}

/* Resposta do usuário */
function responder() {
  document.getElementById("opcoes").style.display = "none";
  document.getElementById("msgObrigado").style.display = "block";
}

/* Eventos dos botões */
document.querySelectorAll("#opcoes button")
  .forEach(btn => btn.addEventListener("click", responder));

carregarVersiculo();
</script>

</body>
</html>
