<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma Palavra para Você</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  color: #f5f5f5;
  background:
    radial-gradient(circle at 15% 50%, rgba(255,215,150,0.12), rgba(0,0,0,0) 45%),
    radial-gradient(circle at 85% 50%, rgba(255,215,150,0.12), rgba(0,0,0,0) 45%),
    radial-gradient(ellipse at top, rgba(255,215,150,0.35), rgba(0,0,0,0) 60%),
    linear-gradient(to bottom, #0b0b0b, #1a1a1a);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(8px);
  border-radius: 22px;
  padding: 32px 24px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  text-align: center;
}

h1 {
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 26px;
}

.versiculo { font-size: 19px; line-height: 1.6; margin-bottom: 12px; }
.referencia { font-size: 14px; opacity: 0.85; margin-bottom: 20px; }
.aplicacao { font-size: 15px; font-style: italic; opacity: 0.95; margin-bottom: 28px; }
.pergunta { font-size: 15px; margin-bottom: 14px; opacity: 0.9; }

.opcoes button {
  width: 100%; padding: 13px; margin: 8px 0;
  border-radius: 30px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.03); color: #f5f5f5;
  font-size: 14px; cursor: pointer; transition: 0.2s ease;
}
.opcoes button:hover { background: rgba(255,255,255,0.08); transform: scale(1.02); }

.agradecimento { margin-top: 18px; font-size: 14px; display: none; opacity: 0.9; }
.contador { margin-top: 30px; font-size: 13px; opacity: 0.75; }
</style>
</head>

<body>

<div class="card">

<h1>Uma Palavra para Você</h1>

<div class="versiculo" id="texto">Carregando versículo...</div>
<div class="referencia" id="ref"></div>
<div class="aplicacao" id="aplicacao"></div>

<div class="pergunta">
O que essa Palavra gerou no seu coração?
</div>

<div class="opcoes">
<button onclick="responder()">🙌 Fui abençoado(a)</button>
<button onclick="responder()">🕊️ Acalmou meu coração</button>
<button onclick="responder()">✨ Era exatamente o que eu precisava</button>
<button onclick="responder()">📖 Senti que Deus falou comigo</button>
</div>

<div class="agradecimento" id="msgObrigado">
🙏 Obrigado por compartilhar.<br>
Que Deus continue falando com você.
</div>
<div id="contador" style="font-size:12px;opacity:0.5;margin-top:20px;"></div>
<div class="contador">
📖 Esta Palavra já alcançou <span id="contador">7.542</span> pessoas
</div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// contador global
db.collection("acessos").doc("global").update({
  total: firebase.firestore.FieldValue.increment(1)
});
</script>

  <script>
db.collection("acessos").doc("global").get().then(doc => {
  document.getElementById("contador").innerText =
    "Alcance: " + doc.data().total;
});
  </script>
<script>
  async function carregarVersiculo() {
    try {
      // 1. Busca o arquivo JSON
      const resposta = await fetch('./almeida_ra.json');
      if (!resposta.ok) throw new Error('Erro ao carregar JSON');
      
      const dados = await resposta.json();
      
      // 2. Lógica para sortear (ajuste 'dados' se seu JSON for um objeto de livros)
      // Se o seu JSON for uma lista direta:
      const indice = Math.floor(Math.random() * dados.length);
      const escolhido = dados[indice];

      // 3. Preenche o HTML (ajuste os nomes .texto e .referencia conforme seu arquivo)
      document.getElementById('texto').innerText = escolhido.texto;
      document.getElementById('ref').innerText = escolhido.referencia;
      
      // Aplicação opcional (se não tiver no JSON, pode deixar fixo ou remover)
      document.getElementById('aplicacao').innerText = "Medite nesta palavra hoje.";

    } catch (erro) {
      console.error('Erro:', erro);
      document.getElementById('texto').innerText = "Não foi possível carregar o versículo.";
    }
  }

  function responder() {
    document.querySelector(".opcoes").style.display = "none";
    document.getElementById("msgObrigado").style.display = "block";
  }

  // Inicializa a função ao carregar a página
  carregarVersiculo();
</script>


</body>
</html>
